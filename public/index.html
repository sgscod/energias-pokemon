<style>
:root{--bg:#f0ddd0;--panel:#fffaf6;--card:#f8ede4;--ink:#5a4d46;--mute:#8f8179;--line:#dfc9ba;--accent:#d32f2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a211d;--panel:#352a25;--card:#3d312b;--ink:#f3e7df;--mute:#b5a59b;--line:#55453d}}
:root[data-theme="dark"]{--bg:#2a211d;--panel:#352a25;--card:#3d312b;--ink:#f3e7df;--mute:#b5a59b;--line:#55453d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
h1{margin:0;font-size:26px;font-weight:700}
#info{color:var(--mute);font-size:14px}
#mnu{font-size:24px;background:none;border:0;min-height:44px;min-width:44px}
.menu{margin:0 16px 6px;background:var(--panel);border-radius:14px;padding:10px;box-shadow:0 2px 8px rgba(80,50,30,.2);display:flex;flex-direction:column;gap:6px}
.menu[hidden]{display:none}
.chips{display:none;gap:10px;padding:8px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.chips.show{display:flex}
.chips button{flex:1;border-radius:12px;border:0;font-weight:700;letter-spacing:.5px;text-transform:uppercase;min-height:46px;background:color-mix(in srgb,var(--pc) 14%,#cfd6e2);color:#6b7585}
.chips button.v{background:var(--pc);color:#fff}
#log{font-size:13px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));border-radius:12px;padding:6px 12px;margin:8px 14px 0}
#log:empty{display:none}
main{max-width:640px;margin:0 auto;padding-top:6px}
.card{background:var(--panel);border-radius:18px;box-shadow:0 2px 6px rgba(80,50,30,.16);padding:14px;margin:0 14px 14px}
.st2{text-align:center;color:var(--mute);font-size:19px;margin:16px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.empty{color:var(--mute);font-size:13px;text-align:center}
.ei{width:1em;height:1em;vertical-align:-.17em;flex:none}
button{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;min-height:42px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;background:transparent;color:var(--ink);border:0;border-bottom:2px dashed var(--line);padding:2px;min-width:0}
.ok{background:#2a9d5c;border-color:#2a9d5c;color:#fff;font-weight:800}
.wide{width:100%;margin-top:8px}
.danger{border-color:var(--accent);color:var(--accent);font-weight:800}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.acts button{flex:1}
.mon{background:color-mix(in srgb,var(--tint) 24%,var(--panel));border-left:8px solid var(--pc)}
.mn{display:flex;align-items:baseline;gap:8px}
.nmb{flex:1;text-align:left;border:0;border-bottom:2px dashed var(--line);border-radius:0;background:none;font-size:22px;font-weight:800;padding:2px;min-height:36px;color:var(--ink)}
#dlg{display:none;position:fixed;inset:0;z-index:35;background:rgba(10,14,28,.6);align-items:flex-end;justify-content:center}
#dlg.on{display:flex}
.dbox{width:100%;max-width:480px;background:var(--panel);border-radius:22px 22px 0 0;padding:14px;max-height:92%;overflow:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.dbox h3{margin:0 0 4px;text-align:center;font-size:20px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin-top:6px;text-align:left}
.tg span:last-child{font-size:13px;color:var(--mute);display:flex;gap:4px;align-items:center}
.tg.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel));font-weight:800}
.err{color:var(--accent);font-weight:700;text-align:center;margin:8px 0 0}
.bd{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.6px;border-radius:99px;padding:3px 10px;background:var(--line);color:var(--mute);margin-bottom:6px}
.bd.a{background:#f5b301;color:#3a2f00}
.mon.act{outline:3px solid #f5b301;outline-offset:-3px}
.ph{color:var(--mute);font-weight:400;font-size:17px}
#srch{display:none;position:fixed;left:0;right:0;top:0;z-index:40;background:var(--panel);box-shadow:0 6px 20px rgba(0,0,0,.35);padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
#srch.on{display:block}
.sb{display:flex;gap:8px}
.sb input{flex:1;font-size:20px;font-weight:700;border:2px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--bg)}
.sres{margin-top:8px;max-height:min(46vh,340px);overflow:auto;display:flex;flex-direction:column;gap:6px}
.sr{display:flex;align-items:center;gap:8px;text-align:left;min-height:46px;width:100%}
.sr b{flex:1}.sr span{color:var(--mute);font-size:13px}
.sr em{font-style:normal;font-size:10px;color:#fff;border-radius:8px;padding:2px 6px;font-weight:800}
.num{color:var(--mute);font-size:20px}
.tps{display:flex;gap:8px;margin-top:8px}
.tp{flex:1;text-align:center;border:3px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:14px;padding:6px;color:var(--mute);font-weight:700;letter-spacing:.5px;font-size:15px}
.ep{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;overflow:hidden;background:var(--c);color:var(--tc);font-weight:800;text-transform:uppercase;padding:0 0 0 10px;min-height:42px;font-size:15px}
.ep .ei{font-size:24px}
.ep i{font-style:normal;background:rgba(0,0,0,.2);align-self:stretch;display:flex;align-items:center;padding:0 12px}
.ep:disabled{opacity:1}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.pal button{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel));font-size:11px;font-weight:800;min-height:62px}
.pal .ei{font-size:28px}
.pal button.tyon{background:var(--c);color:var(--tc)}
.dmg{display:flex;align-items:center;gap:6px}
.dmg button{flex:1;font-weight:800;padding:6px}
.dv{min-width:70px;text-align:center;font-size:30px;font-weight:800;color:var(--accent)}
.stb{font-size:13px;padding:5px 10px;min-height:36px;font-weight:700}
.stb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stp{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;justify-content:center}.stp button{min-height:32px;padding:2px 10px}

.ck:last-child{border:0}
.ck>button.bx{width:38px;min-height:38px;padding:0;font-size:22px;font-weight:800;flex:none}
.ck.on>button.bx{background:#2a9d5c;border-color:#2a9d5c;color:#fff}
.ck div{flex:1}.ck small{display:block;color:var(--mute)}
.ck.on b{text-decoration:line-through;opacity:.6}
.ck .ei{font-size:30px}
.pick h2{text-align:center;margin:4px 0 8px}
.logo{font-size:56px;text-align:center;line-height:1.1}
.rin{width:100%;text-align:center;font-size:30px;font-weight:800;letter-spacing:6px;text-transform:uppercase;border:3px solid var(--accent);border-radius:14px;padding:12px;margin:10px 0 4px;background:var(--bg);color:var(--ink)}

#nav button.v{color:var(--accent);font-weight:800}

.fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:10;border:0;border-radius:30px;min-height:56px;padding:0 22px;font-size:17px;font-weight:800;color:#fff;background:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.3)}
#fab2{bottom:calc(140px + env(safe-area-inset-bottom,0px));background:#41647f;display:none}

.dh .big{font-size:58px;line-height:1}
.dk{font-size:12px;font-weight:700}.dn{font-size:28px;font-weight:800}
.dq{margin:12px 2px 2px;font-weight:800}
.dp{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin-top:8px;min-height:58px;font-size:17px;background:#fff;color:#1d2433;border:3px solid #cfd6e6;text-align:left}
.dp span{font-size:13px;color:#5b6477;display:flex;gap:6px;align-items:center}
.dlg .acts button{background:#2a3350;color:#fff;border-color:#3d4a73}
@media(prefers-reduced-motion:no-preference){.dlg{animation:up .25s ease-out}@keyframes up{from{transform:translateY(60px);opacity:0}}}

    else if(x==="ad"){if(Object.values(D.sel).reduce((n,y)=>n+y,0)<c&&(a.pool[t]||0)-(D.sel[t]||0)>0)add(D.sel,t)}
    else if(x==="rm"){if(D.sel[t])D.sel[t]--}
    else if(x==="okR"){const sl=Object.values(D.sel).reduce((n,y)=>n+y,0),tot=Object.values(a.pool).reduce((n,y)=>n+y,0);
      if(tot<c||sl!==c||D.to==null)return;
      for(const q in D.sel)if(D.sel[q]>0){a.pool[q]-=D.sel[q];add(p.trash,q,D.sel[q])}
      ST.forEach(y=>a[y[0]]=0);p.ac=D.to;p.ret=S.turn;dlgClose();render();push(D.i);return}
  }
  dlgDraw();
});
